<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>PKIG — Panel Pracownika</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0f0f0f;--ink2:#2e2e2e;--ink3:#666;--ink4:#aaa;
  --bg:#f4f2ed;--sf:#fff;--bd:#e4e1da;--bd2:#ccc9c0;
  --ac:#c97c09;--alt:#fff7e6;
  --go:#0e6e3d;--go-bg:#e5f5ec;--go-lt:#9ee4be;
  --bl:#1a4fa0;--bl-bg:#e8eef8;--bl-lt:#b8cef0;
  --pu:#5a2080;--pu-bg:#f0e8f8;
  --rd:#b02020;--rd-bg:#fbe8e8;--rd-lt:#f0b8b8;
  --or:#c96020;--or-bg:#fdf0e8;--or-lt:#e8c090;
  --r:10px;--rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.07);
  --sh-lg:0 6px 28px rgba(0,0,0,.13);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#111}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;display:flex;align-items:center;justify-content:center}
.phone{width:min(390px,100vw);height:min(844px,100vh);background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:420px){.phone{border-radius:46px;box-shadow:0 32px 80px rgba(0,0,0,.6)}}
.sbar{height:44px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;flex-shrink:0}
@media(min-width:420px){.sbar{border-radius:46px 46px 0 0}}
.sbar-t{font-size:13px;font-weight:600;color:#fff;font-family:'DM Mono',monospace}
.app-hdr{background:var(--ink);padding:5px 18px 12px;flex-shrink:0;position:relative;overflow:hidden}
.app-hdr::after{content:'';position:absolute;top:-40px;right:-20px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(201,124,9,.22) 0%,transparent 70%);pointer-events:none}
.ah-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ah-g{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.04em}
.ah-n{font-size:15px;font-weight:700;color:#fff}
.ah-av{width:33px;height:33px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.15);cursor:pointer}
.ah-pills{display:flex;gap:5px}
.ah-pill{padding:3px 8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:100px;font-size:9px;font-weight:500;color:rgba(255,255,255,.45)}
.ah-pill.ok{background:rgba(93,222,138,.14);border-color:rgba(93,222,138,.2);color:#5dde8a}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px}
.scroll::-webkit-scrollbar{display:none}
.bnav{background:rgba(244,242,237,.96);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;padding:6px 0 env(safe-area-inset-bottom,8px);flex-shrink:0}
@media(min-width:420px){.bnav{border-radius:0 0 46px 46px}}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 3px;cursor:pointer;border:none;background:transparent;font-family:'DM Sans',sans-serif}
.bn-icon{font-size:20px;opacity:.3;transition:all .15s}
.bn-lbl{font-size:9px;font-weight:500;color:var(--ink3)}
.bn.on .bn-icon{opacity:1;transform:scale(1.08)}
.bn.on .bn-lbl{color:var(--ac);font-weight:700}
.bn-w{position:relative;display:inline-block}
.bn-badge{position:absolute;top:-3px;right:-5px;background:#ff5c5c;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:100px}
/* HERO */
.hero{background:var(--ink);border-radius:var(--rl);padding:16px 15px 13px;margin-bottom:10px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 85% 15%,rgba(201,124,9,.2) 0%,transparent 55%);pointer-events:none}
.hero-date{font-size:10px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1px}
.hero-clock{font-family:'DM Mono',monospace;font-size:clamp(32px,9vw,44px);font-weight:500;color:#fff;letter-spacing:-.03em;line-height:1;margin-bottom:3px}
.hero-status{font-size:11px;color:rgba(255,255,255,.32);margin-bottom:12px}
.hero-status.on{color:#5dde8a}
.hero-proj{display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;margin-bottom:10px;cursor:pointer}
.hero-proj.sel{background:rgba(201,124,9,.2);border-color:rgba(201,124,9,.35)}
.hp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hp-name{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);flex:1}
.hp-id{font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,.35)}
.hp-chg{font-size:10px;color:rgba(255,255,255,.35)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.stamp{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px 10px}
.stamp.ed{cursor:pointer}.stamp.ed:hover{background:rgba(255,255,255,.1)}
.stamp.fi{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.15)}
.stamp-lbl{font-size:8px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:1px}
.stamp-t{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:rgba(255,255,255,.18)}
.stamp.fi .stamp-t{color:#fff}
.stamp-sub{font-size:9px;color:rgba(255,255,255,.28);margin-top:1px}
.stamp-sub.run{color:#5dde8a}
.hbtn{width:100%;padding:12px;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s}
.hbtn:active{transform:scale(.97)}
.btn-start{background:#5dde8a;color:#042b16}
.btn-stop{background:#ff5c5c;color:#fff}
.btn-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.8}50%{opacity:.2}}
/* CARD */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.ch{padding:10px 13px 8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:6px}
.ch-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ch-t{font-size:12px;font-weight:700;color:var(--ink)}
.ch-s{font-size:10px;color:var(--ink3);margin-top:1px}
.ch-r{display:flex;align-items:center;gap:5px;flex-shrink:0}
.cb{padding:11px 13px}
.req{color:#d04;font-size:9px;font-weight:600;margin-left:3px}
.field-ok{font-size:13px;color:var(--go);margin-left:auto;flex-shrink:0}
/* DEPT + PROJECT PICKER */
.dept-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.dept-btn{padding:5px 11px;border-radius:100px;border:1.5px solid var(--bd);background:var(--sf);font-size:10px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .12s;white-space:nowrap}
.dept-btn.on{font-weight:700}
.proj-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.proj-item:last-child{border-bottom:none}
.proj-item.sel{background:var(--alt);margin:0 -13px;padding:8px 13px}
.pi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pi-id{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;width:38px;flex-shrink:0}
.pi-name{font-size:11px;font-weight:500;color:var(--ink);flex:1}
.pi-chk{width:16px;height:16px;border-radius:4px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:transparent;flex-shrink:0}
.proj-item.sel .pi-chk{background:var(--ac);border-color:var(--ac);color:#fff}
.proj-search{width:100%;padding:8px 11px;border:1.5px solid var(--bd);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);background:var(--sf);margin-bottom:8px}
.proj-search:focus{outline:none;border-color:var(--ac)}
.recent-lbl{font-size:9px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.recent-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;background:var(--bg);border:1.5px solid var(--bd);font-size:10px;font-weight:600;color:var(--ink2);cursor:pointer;margin:0 4px 4px 0;transition:all .12s}
.recent-chip:hover{border-color:var(--ac);color:var(--ac)}
/* ETAP */
.etap-row{display:flex;gap:7px}
.etap-btn{flex:1;padding:12px 7px;border-radius:11px;border:2px solid var(--bd);background:var(--sf);cursor:pointer;text-align:center;transition:all .15s}
.etap-btn:active{transform:scale(.97)}
.etap-btn.sel{background:var(--alt);border-color:var(--ac)}
.etap-icon{font-size:22px;margin-bottom:4px}
.etap-name{font-size:12px;font-weight:700;color:var(--ink2)}
.etap-sub{font-size:9px;color:var(--ink4);margin-top:1px;line-height:1.3}
/* CAR SELECT */
.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.car-btn{padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--bd);background:var(--sf);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:7px}
.car-btn:active{transform:scale(.97)}
.car-btn.sel{background:var(--alt);border-color:var(--ac)}
.car-icon{font-size:16px;flex-shrink:0}
.car-name{font-size:11px;font-weight:600;color:var(--ink2);line-height:1.2}
.car-plate{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);margin-top:1px}
.car-chk{width:14px;height:14px;border-radius:3px;border:2px solid var(--bd);margin-left:auto;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;flex-shrink:0}
.car-btn.sel .car-chk{background:var(--ac);border-color:var(--ac);color:#fff}
/* TOGGLES */
.tgl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgl{border:1.5px solid var(--bd);border-radius:var(--r);padding:9px 9px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.tgl:active{transform:scale(.97)}
.tgl.on{background:var(--alt);border-color:var(--ac)}
.tgl-icon{font-size:16px;flex-shrink:0}
.tgl-name{font-size:10px;font-weight:600;color:var(--ink2);line-height:1.2}
.tgl-chk{width:14px;height:14px;border-radius:3px;border:2px solid var(--bd);margin-left:auto;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;flex-shrink:0}
.tgl.on .tgl-chk{background:var(--ac);border-color:var(--ac);color:#fff}
/* NOTE */
.note-inp{width:100%;min-height:52px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);resize:none;background:var(--sf)}
.note-inp:focus{outline:none;border-color:var(--ac)}
.note-inp::placeholder{color:var(--ink4)}
.mic-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.mic-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mic-idle{background:var(--bg);box-shadow:var(--sh)}
.mic-rec{background:#ff5c5c;animation:rpc 1.1s infinite}
@keyframes rpc{0%{box-shadow:0 0 0 0 rgba(255,92,92,.5)}70%{box-shadow:0 0 0 12px rgba(255,92,92,0)}100%{box-shadow:0 0 0 0 rgba(255,92,92,0)}}
/* MANUAL TIME */
.mt-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.mt-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.mt-inp{padding:9px 11px;border:1.5px solid var(--bd2);border-radius:8px;font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--ink);text-align:center;background:var(--bg);width:100%}
.mt-inp:focus{outline:none;border-color:var(--ac)}
.mt-calc{margin-top:5px;padding:6px 10px;background:var(--alt);border:1px solid #f0cc80;border-radius:7px;font-size:11px;color:var(--ac);font-weight:600;text-align:center;font-family:'DM Mono',monospace}
.mtabs{display:flex;background:var(--sf);border:1.5px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:11px}
.mtab{flex:1;padding:6px;font-size:11px;font-weight:500;color:var(--ink3);cursor:pointer;text-align:center;border:none;background:transparent;font-family:'DM Sans',sans-serif}
.mtab.on{background:var(--ink);color:#fff;font-weight:700}
/* SUBMIT */
.btn-sub{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-sub:active{transform:scale(.98)}
.btn-sub:disabled{background:var(--bd);color:var(--ink4);cursor:not-allowed;transform:none}
.btn-ghost{display:block;text-align:center;margin-top:8px;font-size:11px;color:var(--ink3);cursor:pointer;text-decoration:underline}
/* CONFIRM */
.conf-hero{background:var(--go);border-radius:var(--rl) var(--rl) 0 0;padding:20px 15px;text-align:center}
.conf-circle{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.conf-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:2px}
.conf-sub{font-size:10px;color:rgba(255,255,255,.55)}
.conf-body{background:var(--sf);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--rl) var(--rl);margin-bottom:10px}
.cr{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-bottom:1px solid var(--bd)}
.cr:last-child{border-bottom:none}
.cr-lbl{font-size:9px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1px}
.cr-val{font-size:11px;font-weight:600;color:var(--ink)}
/* MONTH TABLE */
.month-ctrl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:var(--sf);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.mn-lbl{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--ink)}
.sum-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.ss{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:8px 6px;text-align:center}
.ss-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:1px}
.ss-val.ac{color:var(--ac)}.ss-val.go{color:var(--go)}.ss-val.bl{color:var(--bl)}
.ss-lbl{font-size:9px;color:var(--ink3)}
/* Day table */
.day-tbl{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);margin-bottom:10px;table-layout:fixed}
.day-tbl th{font-size:8px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:6px 6px 5px;border-bottom:1.5px solid var(--bd);background:var(--bg);text-align:right;white-space:nowrap;overflow:hidden}
.day-tbl th:first-child{text-align:left;width:44px}
.day-tbl th:nth-child(2){text-align:left;width:auto}
.day-tbl th:nth-child(3){width:58px}
.day-tbl th:nth-child(4){width:30px}
.day-tbl th:nth-child(5){width:30px}
.day-tbl th:last-child{width:36px}
.day-tbl td{padding:0;border-bottom:1px solid var(--bd);vertical-align:top}
.day-tbl tr:last-child td{border-bottom:none}
.dr{display:flex;align-items:center;padding:5px 6px;cursor:pointer;min-height:32px}
.dr:hover{background:#faf9f5}
.dr.wknd .dr-dn{color:var(--pu);font-weight:700}
.dr.today-r .dr-dn{color:var(--ac);font-weight:700}
.dr-dn{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);width:16px;flex-shrink:0}
.dr-dw{font-size:8px;color:var(--ink4);width:20px;flex-shrink:0;padding-left:2px}
.dr-proj{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.dr-time{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3);text-align:right;white-space:nowrap}
.dr-h{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:var(--ac);text-align:right;width:30px;flex-shrink:0}
.dr-prz{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:var(--go);text-align:right;width:30px;flex-shrink:0}
.dr-flag{font-size:9px;width:36px;text-align:right;flex-shrink:0;white-space:nowrap}
.dr-empty .dr-proj{color:var(--ink4);font-style:italic;font-family:'DM Sans',sans-serif;font-weight:400;font-size:10px}
.entry-expand{display:none;background:var(--bg);border-top:1px solid var(--bd);padding:8px 10px}
.entry-expand.open{display:block}
.ee-row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
.ee-lbl{color:var(--ink3)}.ee-val{font-family:'DM Mono',monospace;font-weight:600;color:var(--ink2)}
.tbl-foot{display:flex;align-items:center;padding:7px 6px;background:var(--ink);border-radius:0 0 var(--rl) var(--rl)}
.tf-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);flex:1}
.tf-h{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#fff;width:30px;text-align:right;flex-shrink:0}
.tf-prz{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#5dde8a;width:30px;text-align:right;flex-shrink:0}
.tf-add{font-size:10px;font-weight:600;color:#fac775;width:36px;text-align:right;flex-shrink:0}
/* LEAVE */
.lt-btn{width:100%;padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--bd);background:var(--sf);display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:7px;transition:all .12s}
.lt-btn:active{transform:scale(.98)}
.lt-btn.sel{background:var(--alt);border-color:var(--ac)}
.lt-icon{font-size:20px;flex-shrink:0}
.lt-name{font-size:12px;font-weight:600;color:var(--ink)}
.lt-sub{font-size:10px;color:var(--ink3);margin-top:1px}
/* ALERTS */
.alert{padding:8px 11px;border-radius:9px;font-size:11px;font-weight:500;line-height:1.5;display:flex;align-items:flex-start;gap:6px;margin-bottom:9px}
.a-warn{background:#fff8ec;border:1px solid #f5d48a;color:#7a4a00}
.a-info{background:var(--bl-bg);border:1px solid var(--bl-lt);color:#1a3f7a}
.a-err{background:var(--rd-bg);border:1px solid var(--rd-lt);color:var(--rd)}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:100px;font-size:9px;font-weight:600}
.bg-go{background:var(--go-bg);color:var(--go);border:1px solid var(--go-lt)}
.bg-am{background:var(--alt);color:var(--ac);border:1px solid #f0d090}
.bg-bl{background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-lt)}
.bg-rd{background:var(--rd-bg);color:var(--rd);border:1px solid var(--rd-lt)}
.bg-gr{background:var(--bg);color:var(--ink3);border:1px solid var(--bd)}
.bg-night{background:#1a1000;color:#fac775;border:1px solid rgba(250,199,117,.3)}
/* STA */
.sta{display:inline-block;padding:1px 6px;border-radius:100px;font-size:9px;font-weight:600}
.sta-p{background:#fff8ec;color:#7a4a00;border:1px solid #f5d48a}

function authMessage_(message=''){
  let screen=document.getElementById('auth-screen');
  if(!screen){

    screen.className='auth-screen';
    document.body.appendChild(screen);

    <button class="auth-google" onclick="loginGoogle()">Zaloguj kontem Google</button>
    <div class="auth-error" id="auth-error">${message||''}</div>
  </div>`;
}
function authWait_(message='Sprawdzam konto...'){
  let screen=document.getElementById('auth-screen');
  if(!screen){screen=document.createElement('div');screen.id='auth-screen';screen.className='auth-screen';document.body.appendChild(screen);}

}
function hideAuth_(){document.getElementById('auth-screen')?.remove();}
function authErrorText_(e){
  const code=e?.code||'';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')) return 'Nieprawidłowy login lub hasło.';
  if(code.includes('too-many-requests')) return 'Za dużo prób. Spróbuj ponownie za chwilę.';
  if(code.includes('popup-closed')) return 'Okno logowania zostało zamknięte.';
  return e?.message||'Nie udało się zalogować.';
}
async function loginEmail(){
  const email=document.getElementById('auth-email')?.value.trim();
  const password=document.getElementById('auth-password')?.value||'';
  const err=document.getElementById('auth-error');
  if(!email||!password){if(err)err.textContent='Wpisz adres e-mail i hasło.';return;}
  try{if(err)err.textContent='Logowanie...';await auth.signInWithEmailAndPassword(email,password);}
  catch(e){if(err)err.textContent=authErrorText_(e);}
}
async function loginGoogle(){
  const err=document.getElementById('auth-error');
  try{if(err)err.textContent='Otwieram logowanie Google...';await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
  catch(e){if(err)err.textContent=authErrorText_(e);}
}

async function loadFromServer(){
  const [entriesSnap, leavesSnap] = await Promise.all([
    db.collection('timeEntries').where('uid','==',CURRENT_USER.uid).get(),
    db.collection('leaves').where('uid','==',CURRENT_USER.uid).get()
  ]);
  HISTORY = entriesSnap.docs.map(doc=>{const w=doc.data();return{
    _docId:doc.id,id:w.id||Date.now(),proj:w.proj||w.projectId,date:w.date,start:w.start,end:w.end,hrs:Number(w.hrs||0),
    etap:w.etap,note:w.note||'',wyjazd:!!w.wyjazd,car:w.car||null,carOther:w.carOther||'',zdalna:!!w.zdalna,
    ustalenia:w.ustalenia||'',status:w.status||'pending'
  };}).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || Number(b.id)-Number(a.id));
  LEAVES = leavesSnap.docs.map(doc=>{const u=doc.data();return{
    _docId:doc.id,id:u.id||Date.now(),type:u.type,label:u.label||u.type,df:u.df,dt:u.dt,dni:Number(u.dni||0),opis:u.opis||'',status:u.status||'pending'
  };}).sort((a,b)=>(b.df||'').localeCompare(a.df||''));
  render();
}

async function startFirebaseSession_(user){
  authWait_();
  const profileDoc=await db.collection('users').doc(user.uid).get();
  if(!profileDoc.exists){await auth.signOut();authMessage_('To konto nie ma profilu pracownika. Skontaktuj się z administratorem.');return;}
  const profile=profileDoc.data();
  if(profile.active!==true){await auth.signOut();authMessage_('Konto pracownika jest nieaktywne.');return;}
  CURRENT_USER=user;CURRENT_PROFILE=profile;
  CURRENT_EMP_ID=Number(profile.employeeId||0);CURRENT_EMP_KOD=profile.employeeCode||'';
  document.querySelector('.ah-n').textContent=`${profile.firstName||''} ${profile.lastName||''}`.trim()||user.email;
  document.querySelector('.ah-av').textContent=((profile.firstName?.[0]||'')+(profile.lastName?.[0]||'')).toUpperCase()||'PK';
  const pills=document.querySelectorAll('.ah-pill');
  if(pills[1])pills[1].textContent=profile.employeeCode||user.email;
  document.querySelector('.ah-av').onclick=()=>{if(confirm('Wylogować się?'))logoutFirebase();};
  hideAuth_();
  await loadFromServer();
}

window.addEventListener('load',()=>{
  auth.onAuthStateChanged(user=>{
    if(!user){CURRENT_USER=null;CURRENT_PROFILE=null;authMessage_();return;}
    startFirebaseSession_(user).catch(async e=>{console.error(e);await auth.signOut();authMessage_('Błąd uruchamiania aplikacji: '+(e.message||e));});
  });
});

/* ══ TIME HELPERS ══ */
const today=new Date();
function hms(){return new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fhm(d){return d?d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):'--:--';}
function elStr(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?h+'h '+String(m).padStart(2,'0')+'min':m+'min '+String(sc).padStart(2,'0')+'s';}
function fmtD(s){try{return new Date(s).toLocaleDateString('pl-PL',{day:'numeric',month:'long'});}catch{return s;}}
function monthLbl(y,m){return new Date(y,m-1,1).toLocaleDateString('pl-PL',{month:'long',year:'numeric'});}
function greeting(){const h=new Date().getHours();return h<18?'Dzień dobry,':'Dobry wieczór,';}
function toMins(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function round15(date){const d=new Date(date);d.setMinutes(Math.round(d.getMinutes()/15)*15,0,0);return d;}
function round15s(str){if(!str)return str;const[h,m]=str.split(':').map(Number);const tm=h*60+m,rm=Math.round(tm/15)*15;return String(Math.floor(rm/60)%24).padStart(2,'0')+':'+String(rm%60).padStart(2,'0');}
function hoursB(a,b){if(!a||!b)return 0;let d=(b-a)/3600000;if(d<0)d+=24;return Math.round(d*100)/100;}
function hoursS(s,e){if(!s||!e)return 0;let m=toMins(e)-toMins(s);if(m<0)m+=1440;return Math.round(m/60*100)/100;}
function hstr(h){if(!h||h<=0)return'0h';const wh=Math.floor(h),wm=Math.round((h%1)*60);return wm>0?wh+'h '+wm+'min':wh+'h';}
function isWeekend(ds){const d=new Date(ds);return d.getDay()===0||d.getDay()===6;}
function calcEntry(e){
  const h=e.hrs;const wm=isWeekend(e.date)?1.5:1;
  let prz=0;
  if(isWeekend(e.date)){prz=h*1.5;}
  else if(e.wyjazd){const n=Math.min(h,8),ov=Math.max(h-8,0);prz=n*1.3+ov*1.5;}
  else{const n=Math.min(h,8),ov=Math.max(h-8,0);prz=n+ov*1.5;}
  const dieta=e.wyjazd?45:0;
  return{przelicz:Math.round(prz*100)/100,dieta};
}

      + '<div class="ch"><div class="ch-icon" style="background:#fff8ec">🧳</div>'
      + '<div><div class="ch-t">Wyjazd służbowy?</div>'
      + '<div class="ch-s">Nie zaznaczone = praca na miejscu</div></div></div>'
      + '<div class="cb">'
      + '<div class="' + wCls + '" style="width:100%" onclick="S.wyjazd=!S.wyjazd;render()">'
      + '<div class="tgl-icon">🧳</div>'
      + '<div><div class="tgl-name">Tak — wyjazd służbowy</div></div>'
      + '<div class="tgl-chk">' + (S.wyjazd ? '✓' : '') + '</div>'
      + '</div></div></div>';

  } else if(S.etap === 'biuro'){
    var zCls = S.zdalna ? 'tgl on' : 'tgl';
    out += '<div class="card">'
      + '<div class="ch"><div class="ch-icon" style="background:#f0fff5">🏠</div>'
      + '<div><div class="ch-t">Praca zdalna?</div>'
      + '<div class="ch-s">Nie zaznaczone = praca w biurze</div></div></div>'
      + '<div class="cb">'
      + '<div class="' + zCls + '" style="width:100%" onclick="S.zdalna=!S.zdalna;render()">'
      + '<div class="tgl-icon">🏠</div>'
      + '<div><div class="tgl-name">Tak — praca zdalna (home office)</div></div>'
      + '<div class="tgl-chk">' + (S.zdalna?'✓':'') + '</div>'
      + '</div></div></div>';
  }

  return out;
}


function render(){
  const c=document.getElementById('content');
  removeOv();
  if(TAB==='wpis'){
    if(S.phase==='idle')c.innerHTML=rIdle();
    else if(S.phase==='pick_proj')c.innerHTML=rPickProj();
    else if(S.phase==='working')c.innerHTML=rWorking();
    else if(S.phase==='filling')c.innerHTML=rFilling();
    else if(S.phase==='confirmed')c.innerHTML=rConfirmed();
    bindInputs();
  }else if(TAB==='miesiac')c.innerHTML=rMiesiac();
  else if(TAB==='urlopy')c.innerHTML=rUrlopy();

  if(overlay)renderOv();
}

function bindInputs(){
  const nf=document.getElementById('nf');if(nf){nf.value=S.note;nf.oninput=e=>{S.note=e.target.value;refreshSub()};}
  const uf=document.getElementById('uf');if(uf){uf.value=S.ustalenia;uf.oninput=e=>S.ustalenia=e.target.value;}
  const ps=document.getElementById('proj-search');if(ps){ps.value=S.projSearch;ps.oninput=e=>{S.projSearch=e.target.value;renderProjList()};}
  const ms=document.getElementById('ms'),me=document.getElementById('me');
  if(ms){ms.value=S.manualStart;ms.oninput=e=>{S.manualStart=round15s(e.target.value)||e.target.value;refreshCalc()};}
  if(me){me.value=S.manualEnd;me.oninput=e=>{S.manualEnd=round15s(e.target.value)||e.target.value;refreshCalc()};}
}
function refreshSub(){const b=document.getElementById('sbtn');if(b)b.disabled=!canSub();}
function refreshCalc(){const el=document.getElementById('mcalc');if(!el)return;if(S.manualStart&&S.manualEnd){el.textContent='Łącznie: '+hstr(hoursS(S.manualStart,S.manualEnd));el.style.display='block';}else el.style.display='none';refreshSub();}

function renderProjList(){
  const wrap=document.getElementById('proj-list-wrap');if(!wrap)return;
  const filteredByDept=S.dept?ALL_PROJECTS.filter(p=>p.dept===S.dept):ALL_PROJECTS;
  const q=S.projSearch.trim().toLowerCase();
  const filtered=q?filteredByDept.filter(p=>p.id.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)):filteredByDept;
  if(!filtered.length){wrap.innerHTML=`<div style="font-size:12px;color:var(--ink4);padding:16px;text-align:center;font-style:italic">Brak wyników</div>`;return;}
  wrap.innerHTML=filtered.map(p=>{
    const d=ALL_DEPTS.find(x=>x.id===p.dept);const sc=SL_COLORS[p.sl]||'#aaa';const isSel=S.proj===p.id;
    return`<div class="proj-item ${isSel?'sel':''}" onclick="pickProj('${p.id}')">
      <div class="pi-dot" style="background:${sc}"></div>
      <div class="pi-id" style="color:${sc}">${p.id}</div>
      <div class="pi-name">${p.name}</div>
      <div style="font-size:9px;color:${d?.color||'#aaa'};margin-right:4px;white-space:nowrap">${d?.name||''}</div>
      <div class="pi-chk">${isSel?'✓':''}</div>
    </div>`;
  }).join('');
}

function pickProj(id){
  S.proj=id;
  const p=ALL_PROJECTS.find(x=>x.id===id);
  if(p)S.dept=p.dept;
  // Update recent
  RECENT_PROJS=RECENT_PROJS.filter(x=>x!==id);
  RECENT_PROJS.unshift(id);
  if(RECENT_PROJS.length>3)RECENT_PROJS.pop();
  S.phase='idle';render();
}

/* ══ OVERLAYS ══ */
function removeOv(){document.getElementById('ov')?.remove();}
function renderOv(){
  const div=document.createElement('div');div.id='ov';div.className='overlay';
  if(overlay==='stop-choice'){
    div.innerHTML=`<div class="sheet"><div class="sh-title">Zatrzymujesz pracę</div><div class="sh-sub">Co chcesz zrobić?</div>
      <div class="sh-acts">
        <button class="sh-btn sh-sec" onclick="stopNext()">➡ Przechodzę do kolejnego projektu</button>
        <button class="sh-btn sh-main" onclick="stopEnd()">✓ Kończę dzień pracy</button>
        <button class="sh-btn sh-cancel" onclick="closeOv()">Wróć — kontynuuję</button>
      </div></div>`;
    div.onclick=e=>{if(e.target===div)closeOv();};
  }else if(overlay==='edit-stamp'){
    const w=overlayData.which;
    const cur=w==='start'?fhm(S.startTime).replace('--:--',''):fhm(S.endTime).replace('--:--','');
    div.innerHTML=`<div class="sheet"><div class="sh-title">Popraw godzinę ${w==='start'?'rozpoczęcia':'zakończenia'}</div>
      <div style="font-size:10px;color:var(--ink3);margin-bottom:10px;text-align:center">Zaokrąglona do 15 min</div>
      <input type="time" id="tei" class="tei-inp" step="900" value="${cur}"/>
      <div class="tei-acts"><button class="tei-cancel" onclick="closeOv()">Anuluj</button><button class="tei-save" onclick="saveStamp('${w}')">Zapisz</button></div>
    </div>`;
    div.onclick=e=>{if(e.target===div)closeOv();};
    document.getElementById('phone').appendChild(div);
    setTimeout(()=>document.getElementById('tei')?.focus(),80);return;
  }
  document.getElementById('phone').appendChild(div);
}
function closeOv(){overlay=null;overlayData={};removeOv();}

/* ══ ACTIONS ══ */
function startWork(){
  if(!S.proj){showToast('Wybierz projekt przed rozpoczęciem!');return;}
  S.startTime=round15(new Date());S.phase='working';render();
  S.tick=setInterval(()=>{const c=document.getElementById('lc');if(c)c.textContent=hms();const e=document.getElementById('el');if(e&&S.startTime)e.textContent=elStr(Math.floor((Date.now()-S.startTime)/1000));},1000);
}
function askStop(){overlay='stop-choice';renderOv();}
function stopNext(){S.endTime=round15(new Date());clearInterval(S.tick);S.phase='filling';closeOv();render();}
function stopEnd(){S.endTime=round15(new Date());clearInterval(S.tick);S.phase='filling';closeOv();render();}
function goManual(){S.mode='manual';S.phase='filling';if(!S.proj){S.phase='pick_proj';}render();}
function setMode(m){S.mode=m;render();}
function setEtap(e){S.etap=(S.etap===e?null:e);render();refreshSub();}
function pickCar(id){S.car=id;if(id!=='c14')S.carOther='';render();refreshSub();}
function openEdit(w){overlay='edit-stamp';overlayData={which:w};renderOv();}
function saveStamp(w){
  const v=document.getElementById('tei')?.value;if(!v)return;
  const[h,mn]=v.split(':').map(Number);const tm=h*60+mn,rm=Math.round(tm/15)*15;
  const d=new Date();d.setHours(Math.floor(rm/60)%24,rm%60,0,0);
  if(w==='start')S.startTime=d;else S.endTime=d;
  closeOv();render();
}
async function submitEntry(){

  document.getElementById('phone').appendChild(ov);
  const numericId=Date.now();

    auto:S.car==='c12',zdalna:!!S.zdalna,ustalenia:S.ustalenia||'',status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    const ref=await db.collection('timeEntries').add(payload);
    const entry={_docId:ref.id,id:numericId,proj:payload.proj,date:payload.date,start:startStr,end:endStr,hrs,
      etap:S.etap,note:S.note,wyjazd:S.wyjazd,car:S.car,carOther:S.carOther,zdalna:S.zdalna,ustalenia:S.ustalenia,status:'pending'};
    HISTORY.unshift(entry);SESSION.push({...entry});
    if(!RECENT_PROJS.includes(S.proj)){RECENT_PROJS.unshift(S.proj);if(RECENT_PROJS.length>3)RECENT_PROJS.pop();}
    S.phase='confirmed';render();document.getElementById('content').scrollTo(0,0);
  }catch(e){console.error(e);showToast('Nie zapisano: '+(e.message||'błąd Firestore'));}
  finally{ov.remove();}
}
function nextProject(){
  const prevEnd=SESSION[SESSION.length-1]?.end;
  clearInterval(S.tick);
  const ns=fresh();
  if(prevEnd){const[h,m2]=prevEnd.split(':').map(Number);const d=new Date();d.setHours(h,m2,0,0);ns.startTime=d;ns.phase='pick_proj';}
  Object.assign(S,ns);render();
  if(S.startTime){S.tick=setInterval(()=>{const c=document.getElementById('lc');if(c)c.textContent=hms();},1000);}
}
function endDay(){SESSION=[];clearInterval(S.tick);S=fresh();render();showToast('Dobry dzień! Wpisy czekają na zatwierdzenie.');}
function resetAll(){clearInterval(S.tick);SESSION=[];S=fresh();render();}

function chMonth(d){viewMonth.m+=d;if(viewMonth.m>12){viewMonth.m=1;viewMonth.y++;}if(viewMonth.m<1){viewMonth.m=12;viewMonth.y--;}expandedDays.clear();render();}
function toggleDay(ds){if(expandedDays.has(ds))expandedDays.delete(ds);else expandedDays.add(ds);render();}
function openEditEntry(id){showToast('Edycja wpisu — otwórz w konsoli kierownika lub poczekaj na 4-dniowy limit');}

function togMic(){micOn?stopMic():startMic();}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('Mikrofon: użyj Chrome lub Safari');return;}micOn=true;render();rec=new SR();rec.lang='pl-PL';rec.interimResults=false;rec.onresult=e=>{S.transcript=e.results[0][0].transcript;if(!S.note)S.note=S.transcript;micOn=false;render();setTimeout(()=>{const nf=document.getElementById('nf');if(nf){nf.value=S.note;nf.focus();}},80);refreshSub();};rec.onerror=()=>{micOn=false;showToast('Błąd mikrofonu');render();};rec.onend=()=>{if(micOn){micOn=false;render();}};rec.start();}
function stopMic(){micOn=false;try{rec?.stop();}catch(e){}render();}

function calcLD(){if(newLeave.df&&newLeave.dt){const d=(new Date(newLeave.dt)-new Date(newLeave.df))/86400000;newLeave.dni=d>=0?Math.round(d)+1:0;}render();}
async function submitLeave(){
  if(!CURRENT_USER||!CURRENT_PROFILE){showToast('Zaloguj się ponownie');return;}
  if(!newLeave.type){showToast('Wybierz typ nieobecności');return;}
  if(!newLeave.df||!newLeave.dt){showToast('Podaj daty');return;}
  if(newLeave.type==='inne'&&!newLeave.opis.trim()){showToast('Opisz powód nieobecności');return;}
  const numericId=Date.now();
  const payload={id:numericId,uid:CURRENT_USER.uid,employeeId:CURRENT_EMP_ID,employeeCode:CURRENT_EMP_KOD,
    employeeName:`${CURRENT_PROFILE.firstName||''} ${CURRENT_PROFILE.lastName||''}`.trim(),
    type:newLeave.type,label:newLeave.type,df:newLeave.df,dt:newLeave.dt,dni:newLeave.dni,opis:newLeave.opis||'',status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    const ref=await db.collection('leaves').add(payload);
    LEAVES.unshift({_docId:ref.id,...payload});
    newLeave={type:null,df:'',dt:'',dni:0,opis:''};
    showToast('Wniosek złożony — czeka na kierownika');render();
  }catch(e){console.error(e);showToast('Nie zapisano wniosku: '+(e.message||'błąd Firestore'));}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
document.getElementById('ah-g').textContent=greeting();
setInterval(()=>document.getElementById('sbar-t').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}),30000);
setInterval(()=>{if(S.phase==='idle'||S.phase==='working'){const c=document.getElementById('lc');if(c)c.textContent=hms();}},1000);
render();

</script>
